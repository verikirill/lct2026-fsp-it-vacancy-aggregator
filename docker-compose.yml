services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: talenthub
      POSTGRES_PASSWORD: talenthub
      POSTGRES_DB: talenthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: celery -A app.workers.tasks worker -B -l info
    env_file: .env
    depends_on:
      - redis

volumes:
  pgdata:
